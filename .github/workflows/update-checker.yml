# Description: openresty version update checker

name: OpenResty Update Checker

on:
  workflow_dispatch:
  schedule:
   - cron: 0 */18 * * *

jobs:
  check:
    runs-on: ubuntu-latest

    steps:

    - name: Get latest OpenResty version
      id: getVersion
      run: |
        set -o pipefail
        version=$(wget -qO- -t3 -T15 https://openresty.org/en/download.html \
          | grep -oP 'openresty-\K[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(?=\.tar\.gz)' \
          | sort -uV | tail -n1)
        echo "fetched version=[$version]"
        if [ -z "$version" ]; then
          echo "::error::Failed to fetch OpenResty version"
          exit 1
        fi
        echo "currentVersion=$version" >> "$GITHUB_OUTPUT"

    - name: Compare openresty version
      id: cacheVersion
      uses: actions/cache@v6
      with:
        path: .currentVersion
        key: ${{ steps.getVersion.outputs.currentVersion }}

    - name: Save New Curent Version
      if: steps.cacheVersion.outputs.cache-hit != 'true'
      run: |
        echo ${{ steps.getVersion.outputs.currentVersion }} | tee .currentVersion

    - name: Trigger build
      if: steps.cacheVersion.outputs.cache-hit != 'true'
      uses: peter-evans/repository-dispatch@v3
      with:
        event-type: OpenResty Image Update
        
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 0
        keep_minimum_runs: 2
